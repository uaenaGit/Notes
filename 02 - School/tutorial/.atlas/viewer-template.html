<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人大模型知识图谱</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--text:#e5e8f1;--muted:#8e94a4;--concept:#8090ff;--resource:#36d3b8;--project:#ad8bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}header{position:absolute;z-index:3;left:28px;right:28px;top:16px;display:flex;align-items:center;gap:16px;pointer-events:none}.brand{width:44px;height:44px;background:#7057ef;border:1px solid #9685ff;border-radius:14px;display:grid;place-items:center;font-size:25px;box-shadow:0 0 26px #7057ef44}h1{font-size:21px;line-height:1.3;margin:0;font-weight:600}.subtitle{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:4px}.stats{color:var(--muted);margin-left:10px}input,button,select{font:inherit;color:inherit;background:#11151d;border:1px solid #252a36;border-radius:10px;padding:10px 14px}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #9c8cff}#search{margin-left:auto;width:360px;pointer-events:auto}#layers{pointer-events:auto}#stage{height:100vh;width:100vw;touch-action:none;background-image:radial-gradient(#29304070 .9px,transparent .9px);background-size:33px 33px}#map{width:100%;height:100%;display:block;user-select:none}.sidebar{position:absolute;z-index:2;left:27px;top:104px;width:247px;padding:20px;background:#11151ce8;border:1px solid #232731;border-radius:24px;backdrop-filter:blur(12px)}.heading{color:#8c93a4;font-size:12px;letter-spacing:1px;display:flex;justify-content:space-between;margin-bottom:16px}.row{display:flex;align-items:center;gap:11px;margin:16px 0}.row .count{margin-left:auto;color:#737b8c;font-size:12px}.symbol{width:10px;height:10px;border-radius:50%;background:var(--concept)}.square{border-radius:2px;background:var(--resource)}.ring{background:transparent;border:2px solid var(--project)}hr{border:0;border-top:1px solid #252933;margin:24px 0}.line{width:22px;height:2px;background:#8191ff}.line.gray{background:#777f91}.line.dash{background:repeating-linear-gradient(90deg,#a48bd8 0 5px,transparent 5px 8px)}#regions button{border:0;background:none;padding:5px 0;text-align:left;display:flex;gap:10px;width:100%;border-radius:0;margin:8px 0}#regions button:hover{color:#b4a3ff}.index{color:#777f90;font-size:11px;width:20px}.bar{width:3px;border-radius:2px;background:#ab8cff;align-self:stretch;min-height:19px}.note{font-size:12px;color:#9299aa}.region{fill:#a08aff;fill-opacity:.035;stroke:#77649b;stroke-opacity:.46;stroke-width:1.2}.region-label{fill:#b7b9c8;font-size:16px;font-weight:500}.region-count{fill:#656c7b;font-size:13px}.edge{fill:none;stroke:#808bba;stroke-width:1.35;opacity:.48}.edge[data-kind="学习资料"]{stroke:#7386d2}.edge[data-kind="方向选修"]{stroke:#ad8bdd;stroke-dasharray:6 5;opacity:.35}.edge.on{stroke:#b5baff;opacity:1;stroke-width:2}.node text{fill:#e0e3ef;font-size:17px;font-weight:500;paint-order:stroke;stroke:#11131c;stroke-width:4px;stroke-linejoin:round}.node.resource text{fill:#aeb6c5;font-size:15px;font-weight:400}.node .hit{fill:transparent}.node .halo{fill:#7f8fff;fill-opacity:.12;stroke:#8390ff;stroke-opacity:.6;stroke-width:1.2}.node.selected .halo{stroke:#c1b0ff;stroke-width:2;fill-opacity:.23}.node:hover text{fill:#fff}.node:hover .mark{filter:drop-shadow(0 0 6px #8796ff)}#tools{position:absolute;bottom:24px;left:28px;display:flex;gap:5px}#hint{position:absolute;bottom:24px;right:30px;color:#737d90;font-size:12px;pointer-events:none}#detail{position:absolute;z-index:4;right:24px;top:90px;bottom:80px;width:340px;padding:24px;background:#151923f5;border:1px solid #44405b;border-radius:20px;box-shadow:0 20px 70px #0008;overflow:auto}#detail[hidden]{display:none}#detail h2{font-size:21px;margin:12px 0}#detail h3{font-size:12px;color:#8f99af;margin:20px 0 6px}#detail p{margin:0 0 12px}#detail a{color:#a9b4ff}#close{float:right;padding:3px 10px}.status{font-size:12px;color:#a9a0c3}#detail .related{display:block;width:100%;margin:7px 0;text-align:left;font-size:13px}.low{opacity:.08!important}@media(max-width:850px){.sidebar{width:200px;left:16px;top:90px;padding:16px}.stats{display:none}header{left:16px;right:16px;gap:10px}#search{width:220px}h1{font-size:17px}#detail{right:16px;width:min(340px,calc(100vw - 32px))}}@media(max-width:560px){.sidebar{display:none}header{flex-wrap:wrap}.brand{width:36px;height:36px}#search{order:3;width:100%;margin:4px 0}#layers{margin-left:auto}#hint{bottom:70px;left:20px;right:auto}#detail{top:140px}.subtitle{font-size:10px}}
</style></head><body>
<header><div class="brand" aria-hidden="true">♧</div><div><h1>个人大模型知识图谱</h1><div class="subtitle">LEARNING ATLAS</div></div><div class="stats" id="sync-state">正在读取笔记…</div><input id="search" placeholder="⌕　搜索节点…" aria-label="搜索节点"><button id="layers" aria-label="显示或隐藏图层">◇</button></header>
<section id="stage" aria-label="知识网络，拖动平移，滚轮缩放"><svg id="map" role="group" aria-label="大模型知识节点和关联网络"><defs><marker id="arrow" viewBox="0 0 10 10" refX="12" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8693c7" stroke-width="1.5"/></marker></defs><g id="world"></g></svg></section>
<aside class="sidebar"><div class="heading">图层<span>LAYERS</span></div><div class="row"><i class="symbol square"></i>资料<span class="count">9</span></div><div class="row"><i class="symbol"></i>概念<span class="count">15</span></div><div class="row"><i class="symbol ring"></i>项目<span class="count">12</span></div><hr><div class="heading">关系<span>RELATIONS</span></div><div class="row"><i class="line"></i>前置依赖</div><div class="row"><i class="line gray"></i>学习资料 / 成果积累</div><div class="row"><i class="line dash"></i>方向选修</div><hr><div class="heading">区域<span>REGIONS</span></div><nav id="regions" aria-label="区域导航"></nav><hr><div class="note">当前优先：基础与第一次训练<br>后训练与系统优化按方向选择。<br>点击节点查看资料与验收标准。</div></aside>
<div id="tools"><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="fit">总览</button></div><div id="hint">拖动平移 · 滚轮缩放 · 点击节点查看详情</div><aside id="detail" hidden aria-live="polite"></aside>
<script>
const D=__DATA__;
const positions={py:[465,800],math:[675,850],d2l:[410,910],train:[610,705],linear:[440,695],classify:[780,730],grad:[660,570],attn:[835,485],karpathy:[925,635],lm:[880,330],gpt:[685,430],paper:[1030,455],cs336:[655,180],token:[480,285],pretrain:[825,180],perf:[965,230],lab:[560,380],report:[415,445],hf:[1260,285],eval:[1440,170],rag:[1280,185],sft:[1560,245],domain:[1450,330],dpo:[1700,320],sys:[1330,500],cuda:[1510,475],kernel:[1690,535],kv:[1420,615],vllm:[1730,670],bench:[1580,710],algo:[1260,865],git:[1440,840],notes:[1610,925],research:[1760,855],review:[1455,1000],job:[1730,1000]};
D.nodes.forEach((n,i)=>{[n.x,n.y]=positions[n.id]||[400+(i%5)*240,200+Math.floor(i/5)*120]});
const regions=[{name:'训练主线 · 基础 → GPT → CS336',phase:'先完成基础项目，再逐步向上探索',x:330,y:95,w:790,h:895,ids:D.nodes.filter(n=>n.group<3).map(n=>n.id)},{name:'后训练与应用算法',phase:'分支 A · 按方向选择',x:1185,y:95,w:650,h:290,ids:D.nodes.filter(n=>n.group===3).map(n=>n.id)},{name:'系统与推理优化',phase:'分支 B · 按方向选择',x:1185,y:425,w:650,h:330,ids:D.nodes.filter(n=>n.group===4).map(n=>n.id)},{name:'长期能力与就业',phase:'持续积累',x:1185,y:795,w:650,h:250,ids:D.nodes.filter(n=>n.group===5).map(n=>n.id)}];
const world=document.getElementById('world'),stage=document.getElementById('stage'),svg=document.getElementById('map'),detail=document.getElementById('detail');const NS='http://www.w3.org/2000/svg',lookup=new Map(D.nodes.map(n=>[n.id,n]));let scale=1,tx=0,ty=0,selected=null,progress={};try{progress=JSON.parse(localStorage.getItem('llm-atlas-progress-v1')||'{}')}catch(e){}
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.appendChild(e);return e}
function transform(){world.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fitRegion(i){const w=stage.clientWidth,h=stage.clientHeight;if(i<0){scale=Math.min(w/1900,h/1100);tx=(w-1900*scale)/2;ty=(h-1100*scale)/2}else{const r=regions[i],left=w>850?295:20;scale=Math.min((w-left-40)/r.w,(h-150)/r.h);scale=Math.max(.2,scale);tx=left+(w-left-40-r.w*scale)/2-r.x*scale;ty=100+(h-150-r.h*scale)/2-r.y*scale}transform()}
regions.forEach((r,i)=>{el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:24,class:'region'},world);el('circle',{cx:r.x+20,cy:r.y+23,r:4,fill:['#ad8bff','#39d3b8','#8191ff','#9da8bb'][i]},world);el('text',{x:r.x+34,y:r.y+28,class:'region-label'},world,r.name);el('text',{x:r.x+r.w-20,y:r.y+28,'text-anchor':'end',class:'region-count'},world,r.ids.length+' 节点');el('text',{x:r.x+r.w-20,y:r.y+r.h-17,'text-anchor':'end',class:'region-count'},world,'0'+(i+1))});
D.edges.forEach(e=>{const a=lookup.get(e.a),b=lookup.get(e.b);el('path',{d:`M ${a.x} ${a.y} L ${b.x} ${b.y}`,class:'edge','data-a':e.a,'data-b':e.b,'data-kind':e.kind,'marker-end':'url(#arrow)'},world)});
D.nodes.forEach(n=>{const a=el('a',{href:'#'+n.id,'aria-label':n.label+'，'+n.kind,class:'node'+(n.kind==='资料'?' resource':''),'data-id':n.id},world);el('circle',{cx:n.x,cy:n.y,r:24,class:'hit'},a);if(n.kind==='项目')el('circle',{cx:n.x,cy:n.y,r:13,class:'halo'},a);if(n.kind==='资料')el('rect',{x:n.x-4,y:n.y-4,width:8,height:8,rx:1.3,fill:'#36d3b8',class:'mark'},a);else el('circle',{cx:n.x,cy:n.y,r:n.kind==='项目'?8:5,fill:'#8090ff',class:'mark'},a);el('text',{x:n.x,y:n.y+(n.kind==='资料'?29:-20),'text-anchor':'middle'},a,n.label);a.addEventListener('click',e=>{e.preventDefault();show(n.id)})});
function show(id){selected=id;const n=lookup.get(id);document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===id));document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',e.dataset.a===id||e.dataset.b===id));detail.hidden=false;detail.replaceChildren();function text(tag,value){const e=document.createElement(tag);e.textContent=value;detail.appendChild(e);return e}const close=text('button','×');close.id='close';close.setAttribute('aria-label','关闭详情');close.onclick=()=>{detail.hidden=true;document.querySelectorAll('.edge').forEach(e=>e.classList.remove('on'))};text('div',n.kind+' / '+D.groups[n.group].name).className='status';text('h2',n.label);text('h3','学习范围');text('p',n.desc);text('h3','验收标准');text('p',n.goal);if(n.url){const a=text('a','打开资料入口 ↗');a.href=n.url;a.target='_blank';a.rel='noopener noreferrer'}text('h3','我的状态（在 Obsidian 属性中修改）');const s=document.createElement('select');s.setAttribute('aria-label','节点学习状态');['未开始','学习中','已实践待复习','已通过自测'].forEach(v=>{const o=document.createElement('option');o.textContent=v;s.appendChild(o)});s.value=n.status||'未开始';s.disabled=true;s.onchange=()=>{progress[id]=s.value;try{localStorage.setItem('llm-atlas-progress-v1',JSON.stringify(progress))}catch(e){text('p','当前环境无法保存状态。')}};detail.appendChild(s);if(n.noteUri){const a=text('a','在 Obsidian 打开并编辑笔记 ↗');a.href=n.noteUri;a.style.display='block';a.style.marginTop='16px'}text('h3','个人笔记（实时读取）');const pre=text('pre',n.body||'');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.8';text('h3','直接关联');D.edges.filter(e=>e.a===id||e.b===id).forEach(e=>{const other=lookup.get(e.a===id?e.b:e.a),b=text('button',(e.a===id?'→ ':'← ')+other.label+' · '+e.kind);b.className='related';b.onclick=()=>show(other.id)})}
const nav=document.getElementById('regions');regions.forEach((r,i)=>{const b=document.createElement('button');b.innerHTML='<span class="index">0'+(i+1)+'</span><span class="bar"></span><span></span>';b.lastChild.textContent=r.name.split(' · ')[0];b.onclick=()=>fitRegion(i);nav.appendChild(b)});
document.getElementById('layers').onclick=()=>{const s=document.querySelector('.sidebar');s.style.display=getComputedStyle(s).display==='none'?'block':'none'};
document.querySelectorAll('.row .count').forEach((c,i)=>c.textContent=D.nodes.filter(n=>n.kind===['资料','概念','项目'][i]).length);
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(a=>{const n=lookup.get(a.dataset.id);a.classList.toggle('low',!!q&&!(n.label+n.desc+n.kind+(n.body||'')).toLowerCase().includes(q))});if(q){const n=D.nodes.find(n=>(n.label+n.desc+n.kind+(n.body||'')).toLowerCase().includes(q));if(n)show(n.id)}};
function zoom(f,x=stage.clientWidth/2,y=stage.clientHeight/2){const next=Math.max(.15,Math.min(3,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}};svg.onpointerup=svg.onpointercancel=()=>drag=null;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('fit').onclick=()=>fitRegion(-1);new ResizeObserver(()=>fitRegion(-1)).observe(stage);fitRegion(-1);

const syncState=document.getElementById('sync-state');
let revision=D.revision;
function structure(d){return JSON.stringify([d.nodes.map(n=>[n.id,n.group,n.kind,n.canvasX,n.canvasY]),d.edges])}
let structureVersion=structure(D),pollBusy=false;
syncState.textContent=location.protocol==='file:'?'离线快照 · 自动同步请使用启动入口':'自动同步中 · 内容来自 Obsidian';
async function poll(){if(pollBusy)return;pollBusy=true;try{
 const response=await fetch('/api/snapshot',{cache:'no-store'});if(!response.ok)throw Error('saving');
 const next=await response.json();
 syncState.textContent=`${next.nodes.length} 节点 · ${next.edges.length} 关系 · 自动同步中`;
 if(next.revision!==revision){
   if(structure(next)!==structureVersion){location.reload();return}
   next.nodes.forEach(n=>{const old=lookup.get(n.id);if(old)Object.assign(old,n)});
   document.querySelectorAll('.node').forEach(a=>{const n=lookup.get(a.dataset.id);a.querySelector('text').textContent=n.label;a.setAttribute('aria-label',n.label+'，'+n.kind)});
   revision=next.revision;
   if(selected&&!detail.hidden){const pos=detail.scrollTop;show(selected);detail.scrollTop=pos}
 }
}catch(e){syncState.textContent='同步暂停 · 请确认本地服务运行中'}finally{pollBusy=false}}
if(location.protocol!=='file:'){poll();setInterval(poll,2000)}

</script></body></html>
