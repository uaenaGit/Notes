const world=document.getElementById('world'),stage=document.getElementById('stage'),svg=document.getElementById('map'),detail=document.getElementById('detail');const NS='http://www.w3.org/2000/svg',lookup=new Map(D.nodes.map(n=>[n.id,n]));let scale=1,tx=0,ty=0,selected=null,progress={};try{progress=JSON.parse(localStorage.getItem('llm-atlas-progress-v1')||'{}')}catch(e){}
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.appendChild(e);return e}
function transform(){world.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fitRegion(i){const w=stage.clientWidth,h=stage.clientHeight;if(i<0){scale=Math.min(w/1900,h/1100);tx=(w-1900*scale)/2;ty=(h-1100*scale)/2}else{const r=regions[i],left=w>850?295:20;scale=Math.min((w-left-40)/r.w,(h-150)/r.h);scale=Math.max(.2,scale);tx=left+(w-left-40-r.w*scale)/2-r.x*scale;ty=100+(h-150-r.h*scale)/2-r.y*scale}transform()}
regions.forEach((r,i)=>{el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:24,class:'region'},world);el('circle',{cx:r.x+20,cy:r.y+23,r:4,fill:['#ad8bff','#39d3b8','#8191ff','#9da8bb'][i]},world);el('text',{x:r.x+34,y:r.y+28,class:'region-label'},world,r.name);el('text',{x:r.x+r.w-20,y:r.y+28,'text-anchor':'end',class:'region-count'},world,r.ids.length+' 节点');el('text',{x:r.x+r.w-20,y:r.y+r.h-17,'text-anchor':'end',class:'region-count'},world,'0'+(i+1))});
D.edges.forEach(e=>{const a=lookup.get(e.a),b=lookup.get(e.b);el('path',{d:`M ${a.x} ${a.y} L ${b.x} ${b.y}`,class:'edge','data-a':e.a,'data-b':e.b,'data-kind':e.kind,'marker-end':'url(#arrow)'},world)});
D.nodes.forEach(n=>{const a=el('a',{href:'#'+n.id,'aria-label':n.label+'，'+n.kind,class:'node'+(n.kind==='资料'?' resource':''),'data-id':n.id},world);el('circle',{cx:n.x,cy:n.y,r:24,class:'hit'},a);if(n.kind==='项目')el('circle',{cx:n.x,cy:n.y,r:13,class:'halo'},a);if(n.kind==='资料')el('rect',{x:n.x-4,y:n.y-4,width:8,height:8,rx:1.3,fill:'#36d3b8',class:'mark'},a);else el('circle',{cx:n.x,cy:n.y,r:n.kind==='项目'?8:5,fill:'#8090ff',class:'mark'},a);el('text',{x:n.x,y:n.y+(n.kind==='资料'?29:-20),'text-anchor':'middle'},a,n.label);a.addEventListener('click',e=>{e.preventDefault();show(n.id)})});
function show(id){selected=id;const n=lookup.get(id);document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===id));document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',e.dataset.a===id||e.dataset.b===id));detail.hidden=false;detail.replaceChildren();function text(tag,value){const e=document.createElement(tag);e.textContent=value;detail.appendChild(e);return e}const close=text('button','×');close.id='close';close.setAttribute('aria-label','关闭详情');close.onclick=()=>{detail.hidden=true;document.querySelectorAll('.edge').forEach(e=>e.classList.remove('on'))};text('div',n.kind+' / '+D.groups[n.group].name).className='status';text('h2',n.label);text('h3','学习范围');text('p',n.desc);text('h3','验收标准');text('p',n.goal);if(n.url){const a=text('a','打开资料入口 ↗');a.href=n.url;a.target='_blank';a.rel='noopener noreferrer'}text('h3','我的状态（在 Obsidian 属性中修改）');const s=document.createElement('select');s.setAttribute('aria-label','节点学习状态');['未开始','学习中','已实践待复习','已通过自测'].forEach(v=>{const o=document.createElement('option');o.textContent=v;s.appendChild(o)});s.value=n.status||'未开始';s.disabled=true;s.onchange=()=>{progress[id]=s.value;try{localStorage.setItem('llm-atlas-progress-v1',JSON.stringify(progress))}catch(e){text('p','当前环境无法保存状态。')}};detail.appendChild(s);if(n.noteUri){const a=text('a','在 Obsidian 打开并编辑笔记 ↗');a.href=n.noteUri;a.style.display='block';a.style.marginTop='16px'}text('h3','个人笔记（实时读取）');const pre=text('pre',n.body||'');pre.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.8';text('h3','直接关联');D.edges.filter(e=>e.a===id||e.b===id).forEach(e=>{const other=lookup.get(e.a===id?e.b:e.a),b=text('button',(e.a===id?'→ ':'← ')+other.label+' · '+e.kind);b.className='related';b.onclick=()=>show(other.id)})}
const nav=document.getElementById('regions');regions.forEach((r,i)=>{const b=document.createElement('button');b.innerHTML='<span class="index">0'+(i+1)+'</span><span class="bar"></span><span></span>';b.lastChild.textContent=r.name.split(' · ')[0];b.onclick=()=>fitRegion(i);nav.appendChild(b)});
document.getElementById('layers').onclick=()=>{const s=document.querySelector('.sidebar');s.style.display=getComputedStyle(s).display==='none'?'block':'none'};
document.querySelectorAll('.row .count').forEach((c,i)=>c.textContent=D.nodes.filter(n=>n.kind===['资料','概念','项目'][i]).length);
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(a=>{const n=lookup.get(a.dataset.id);a.classList.toggle('low',!!q&&!(n.label+n.desc+n.kind+(n.body||'')).toLowerCase().includes(q))});if(q){const n=D.nodes.find(n=>(n.label+n.desc+n.kind+(n.body||'')).toLowerCase().includes(q));if(n)show(n.id)}};
function zoom(f,x=stage.clientWidth/2,y=stage.clientHeight/2){const next=Math.max(.15,Math.min(3,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}};svg.onpointerup=svg.onpointercancel=()=>drag=null;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('fit').onclick=()=>fitRegion(-1);new ResizeObserver(()=>fitRegion(-1)).observe(stage);fitRegion(-1);

const syncState=document.getElementById('sync-state');
let revision=D.revision;
function structure(d){return JSON.stringify([d.nodes.map(n=>[n.id,n.group,n.kind,n.canvasX,n.canvasY]),d.edges])}
let structureVersion=structure(D),pollBusy=false;
syncState.textContent=location.protocol==='file:'?'离线快照 · 自动同步请使用启动入口':'自动同步中 · 内容来自 Obsidian';
async function poll(){if(pollBusy)return;pollBusy=true;try{
 const response=await fetch('/api/snapshot',{cache:'no-store'});if(!response.ok)throw Error('saving');
 const next=await response.json();
 syncState.textContent=`${next.nodes.length} 节点 · ${next.edges.length} 关系 · 自动同步中`;
 if(next.revision!==revision){
   if(structure(next)!==structureVersion){location.reload();return}
   next.nodes.forEach(n=>{const old=lookup.get(n.id);if(old)Object.assign(old,n)});
   document.querySelectorAll('.node').forEach(a=>{const n=lookup.get(a.dataset.id);a.querySelector('text').textContent=n.label;a.setAttribute('aria-label',n.label+'，'+n.kind)});
   revision=next.revision;
   if(selected&&!detail.hidden){const pos=detail.scrollTop;show(selected);detail.scrollTop=pos}
 }
}catch(e){syncState.textContent='同步暂停 · 请确认本地服务运行中'}finally{pollBusy=false}}
if(location.protocol!=='file:'){poll();setInterval(poll,2000)}

</script></body></html>
