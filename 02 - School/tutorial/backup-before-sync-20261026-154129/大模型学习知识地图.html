<script>
const D={"nodes": [{"id": "py", "label": "Python 与张量", "kind": "概念", "desc": "形状、广播、索引、设备与 dtype。已有 Python 基础，可边写边查。", "goal": "能预测矩阵运算的输出形状，并定位维度错误。", "url": "https://numpy.org/doc/stable/user/absolute_beginners.html", "group": 0, "x": 45, "y": 105}, {"id": "math", "label": "按需补数学", "kind": "概念", "desc": "矩阵乘法、偏导、链式法则、条件概率、期望和最大似然。遇到实际卡点再补。", "goal": "用一个简单函数手算梯度，并与自动求导比较。", "url": "https://www.3blue1brown.com/topics/linear-algebra", "group": 0, "x": 435, "y": 105}, {"id": "d2l", "label": "动手学深度学习", "kind": "资料", "desc": "当前唯一主教材：预备知识 → 线性神经网络 → 多层感知机。先不通读全书。", "goal": "完成相关代码练习，能够解释训练流程。", "url": "https://zh.d2l.ai/", "group": 0, "x": 45, "y": 275}, {"id": "train", "label": "PyTorch 训练闭环", "kind": "概念", "desc": "数据加载、前向、loss、清梯度、反向、更新、验证、保存。官方教程按需查阅。", "goal": "脱离完整示例写出训练与验证流程。", "url": "https://pytorch.org/tutorials/beginner/basics/intro.html", "group": 0, "x": 435, "y": 275}, {"id": "linear", "label": "NumPy 线性回归", "kind": "项目", "desc": "自己实现预测、均方误差、梯度和参数更新，画出损失曲线。", "goal": "能解释梯度方向，检查有限差分与手写梯度一致。", "url": "", "group": 0, "x": 45, "y": 445}, {"id": "classify", "label": "分类训练项目", "kind": "项目", "desc": "用小数据集训练 MLP，比较学习率，保存和恢复模型，区分训练/验证/测试。", "goal": "有可运行脚本、曲线和一页实验结论。", "url": "", "group": 0, "x": 435, "y": 445}, {"id": "grad", "label": "反向传播与优化", "kind": "概念", "desc": "理解计算图、链式法则、梯度累加、SGD/Adam 和学习率。", "goal": "能解释 backward、zero_grad、step 的职责。", "url": "", "group": 1, "x": 885, "y": 105}, {"id": "attn", "label": "注意力与因果掩码", "kind": "概念", "desc": "理解 Q/K/V、多头注意力、残差、归一化与位置表示。", "goal": "手写 causal attention，验证未来 token 不影响当前位置。", "url": "https://jalammar.github.io/illustrated-transformer/", "group": 1, "x": 1275, "y": 105}, {"id": "karpathy", "label": "Karpathy 教学", "kind": "资料", "desc": "按需要推进 micrograd → makemore → GPT；不要与多门同类课程同时铺开。", "goal": "看后重新实现关键模块并解释。", "url": "https://karpathy.ai/zero-to-hero.html", "group": 1, "x": 885, "y": 275}, {"id": "lm", "label": "语言模型目标", "kind": "概念", "desc": "Next-token prediction、交叉熵、困惑度、训练并行与逐 token 生成。", "goal": "解释输入标签如何错位，以及训练与推理的区别。", "url": "", "group": 1, "x": 1275, "y": 275}, {"id": "gpt", "label": "自己实现小型 GPT", "kind": "项目", "desc": "用小文本训练 decoder-only 模型，记录损失、配置、采样与 checkpoint。", "goal": "能在极小数据上过拟合，并完成三组可解释的对照实验。", "url": "https://github.com/karpathy/nanoGPT", "group": 1, "x": 885, "y": 445}, {"id": "paper", "label": "Transformer 原论文", "kind": "资料", "desc": "选读 Attention Is All You Need；原文是编码器—解码器，注意与 GPT 的区别。", "goal": "结合代码说明多头注意力的形状与作用。", "url": "https://arxiv.org/abs/1706.03762", "group": 1, "x": 1275, "y": 445}, {"id": "cs336", "label": "CS336 课程与作业", "kind": "资料", "desc": "固定一个公开年份，讲义和作业配套。此处链接到 Spring 2025，不表示最新版本。", "goal": "记录完成范围，通过对应检查，不以看完视频为唯一目标。", "url": "https://stanford-cs336.github.io/spring2025/", "group": 2, "x": 1725, "y": 105}, {"id": "token", "label": "Tokenizer 与数据", "kind": "概念", "desc": "分词、数据划分、清洗、去重和质量；具体实现按选定课程版本。", "goal": "解释文本到 token 再到 batch 的过程，检查数据泄漏。", "url": "", "group": 2, "x": 2115, "y": 105}, {"id": "pretrain", "label": "训练与验证", "kind": "概念", "desc": "优化器、学习率调度、数值稳定性、配置与断点恢复。", "goal": "能从中断处恢复训练，并复现验证结果。", "url": "", "group": 2, "x": 1725, "y": 275}, {"id": "perf", "label": "性能与显存", "kind": "概念", "desc": "观察吞吐、峰值显存和瓶颈；学习混合精度与分布式基本概念。", "goal": "报告硬件与负载，不将小规模结论无条件外推。", "url": "", "group": 2, "x": 2115, "y": 275}, {"id": "lab", "label": "小模型训练实验台", "kind": "项目", "desc": "整合 tokenizer、训练、日志、checkpoint、验证和性能测量。算力不足先缩小规模。", "goal": "代码、配置、依赖和报告可让他人复现。", "url": "", "group": 2, "x": 1725, "y": 445}, {"id": "report", "label": "训练实验报告", "kind": "项目", "desc": "比较少量设置，说明验证损失、性能变化、成本与局限。", "goal": "明确基线、控制变量、证据和未验证部分。", "url": "", "group": 2, "x": 2115, "y": 445}, {"id": "hf", "label": "Hugging Face 课程", "kind": "资料", "desc": "进入该分支后学习模型、tokenizer、Datasets、训练接口。文档与安装版本对齐。", "goal": "能加载小模型、构造数据并完成评测。", "url": "https://huggingface.co/learn/llm-course/chapter1/1", "group": 3, "x": 45, "y": 755}, {"id": "eval", "label": "评测与错误分析", "kind": "概念", "desc": "先建独立评测集，定义正确性、引用、拒答与成本；模型裁判需人工抽查。", "goal": "能区分检索失败、知识缺失和生成错误。", "url": "", "group": 3, "x": 435, " const world=document.getElementById('world'),stage=document.getElementById('stage'),svg=document.getElementById('map'),detail=document.getElementById('detail');const NS='http://www.w3.org/2000/svg',lookup=new Map(D.nodes.map(n=>[n.id,n]));let scale=1,tx=0,ty=0,selected=null,progress={};try{progress=JSON.parse(localStorage.getItem('llm-atlas-progress-v1')||'{}')}catch(e){}
function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.appendChild(e);return e}
function transform(){world.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function fitRegion(i){const w=stage.clientWidth,h=stage.clientHeight;if(i<0){scale=Math.min(w/1900,h/1100);tx=(w-1900*scale)/2;ty=(h-1100*scale)/2}else{const r=regions[i],left=w>850?295:20;scale=Math.min((w-left-40)/r.w,(h-150)/r.h);scale=Math.max(.2,scale);tx=left+(w-left-40-r.w*scale)/2-r.x*scale;ty=100+(h-150-r.h*scale)/2-r.y*scale}transform()}
regions.forEach((r,i)=>{el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:24,class:'region'},world);el('circle',{cx:r.x+20,cy:r.y+23,r:4,fill:['#ad8bff','#39d3b8','#8191ff','#9da8bb'][i]},world);el('text',{x:r.x+34,y:r.y+28,class:'region-label'},world,r.name);el('text',{x:r.x+r.w-20,y:r.y+28,'text-anchor':'end',class:'region-count'},world,r.ids.length+' 节点');el('text',{x:r.x+r.w-20,y:r.y+r.h-17,'text-anchor':'end',class:'region-count'},world,'0'+(i+1))});

D.nodes.forEach(n=>{const a=el('a',{href:'#'+n.id,'aria-label':n.label+'，'+n.kind,class:'node'+(n.kind==='资料'?' resource':''),'data-id':n.id},world);el('circle',{cx:n.x,cy:n.y,r:24,class:'hit'},a);if(n.kind==='项目')el('circle',{cx:n.x,cy:n.y,r:13,class:'halo'},a);if(n.kind==='资料')el('rect',{x:n.x-4,y:n.y-4,width:8,height:8,rx:1.3,fill:'#36d3b8',class:'mark'},a);else el('circle',{cx:n.x,cy:n.y,r:n.kind==='项目'?8:5,fill:'#8090ff',class:'mark'},a);el('text',{x:n.x,y:n.y+(n.kind==='资料'?29:-20),'text-anchor':'middle'},a,n.label);a.addEventListener('click',e=>{e.preventDefault();show(n.id)})});
function show(id){selected=id;const n=lookup.get(id);document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===id));document.querySelectorAll('.edge').forEach(e=>e.classList.toggle('on',e.dataset.a===id||e.dataset.b===id));detail.hidden=false;detail.replaceChildren();function text(tag,value){const e=document.createElement(tag);e.textContent=value;detail.appendChild(e);return e}const close=text('button','×');close.id='close';close.setAttribute('aria-label','关闭详情');close.onclick=()=>{detail.hidden=true;document.querySelectorAll('.edge').forEach(e=>e.classList.remove('on'))};text('div',n.kind+' / '+D.groups[n.group].name).className='status';text('h2',n.label);text('h3','学习范围');text('p',n.desc);text('h3','验收标准');text('p',n.goal);if(n.url){const a=text('a','打开资料入口 ↗');a.href=n.url;a.target='_blank';a.rel='noopener noreferrer'}text('h3','我的状态');const s=document.createElement('select');s.setAttribute('aria-label','节点学习状态');['未开始','学习中','已实践待复习','已通过自测'].forEach(v=>{const o=document.createElement('option');o.textContent=v;s.appendChild(o)});s.value=progress[id]||'未开始';s.onchange=()=>{progress[id]=s.value;try{localStorage.setItem('llm-atlas-progress-v1',JSON.stringify(progress))}catch(e){text('p','当前环境无法保存状态。')}};detail.appendChild(s);text('h3','直接关联');D.edges.filter(e=>e.a===id||e.b===id).forEach(e=>{const other=lookup.get(e.a===id?e.b:e.a),b=text('button',(e.a===id?'→ ':'← ')+other.label+' · '+e.kind);b.className='related';b.onclick=()=>show(other.id)})}
const nav=document.getElementById('regions');regions.forEach((r,i)=>{const b=document.createElement('button');b.innerHTML='<span class="index">0'+(i+1)+'</span><span class="bar"></span><span></span>';b.lastChild.textContent=r.name.split(' · ')[0];b.onclick=()=>fitRegion(i);nav.appendChild(b)});
document.getElementById('layers').onclick=()=>{const s=document.querySelector('.sidebar');s.style.display=getComputedStyle(s).display==='none'?'block':'none'};

function zoom(f,x=stage.clientWidth/2,y=stage.clientHeight/2){const next=Math.max(.15,Math.min(3,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;transform()}
stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;transform()}};svg.onpointerup=svg.onpointercancel=()=>drag=null;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);document.getElementById('fit').onclick=()=>fitRegion(-1);new ResizeObserver(()=>fitRegion(-1)).observe(stage);fitRegion(-1);
