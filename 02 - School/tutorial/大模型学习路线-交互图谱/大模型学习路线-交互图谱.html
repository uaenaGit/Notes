<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大模型图谱">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0%200%2032%2032'%3E%3Crect width='32' height='32' rx='8' fill='%235a6cff'/%3E%3Ccircle cx='16' cy='10' r='3' fill='white'/%3E%3Ccircle cx='10' cy='22' r='2.4' fill='white'/%3E%3Ccircle cx='22' cy='22' r='2.4' fill='white'/%3E%3C/svg%3E">
<title>大模型学习路线 · 知识图谱</title>
<style>
:root{
  --bg:#06080f;
  --panel:#0a0d16;
  --panel-2:#0e1320;
  --line:#171d2c;
  --line-2:#212a3d;
  --txt:#dfe6f5;
  --muted:#8b96ad;
  --dim:#5d6880;
  --accent:#8b9cff;
  --green:#3ddc97;
  --amber:#f0b45f;
  --violet:#b98cff;
  --teal:#48c9c0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:"Inter","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1c2436;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#2a3550;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ---------- top bar ---------- */
.globalbar{
  height:62px;flex:0 0 62px;display:flex;align-items:center;gap:18px;padding:0 20px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a0d16 0%,#070a11 100%);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(140deg,#7b6cff 0%,#4f7cff 55%,#38d6c4 100%);
  box-shadow:0 8px 22px rgba(88,110,255,.32), inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}
.brand-text span{font-size:9.5px;letter-spacing:.22em;color:#6e7a96;margin-top:3px}
.stats{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#77839c;white-space:nowrap}
.stats b{color:#aab6cf;font-weight:600}
.stats .sep{color:#2c3549}
.grow{flex:1}
.search{position:relative;width:300px;flex:0 1 300px}
.search .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55;pointer-events:none}
.search input{
  width:100%;height:36px;border-radius:10px;border:1px solid #1b2233;background:#0b0f1a;
  color:var(--txt);padding:0 44px 0 34px;font-size:12.5px;outline:none;transition:border-color .15s, background .15s;
}
.search input::placeholder{color:#59647c}
.search input:focus{border-color:#35406a;background:#0c111e;box-shadow:0 0 0 3px rgba(110,130,255,.08)}
.search kbd{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:10px;color:#5d6880;border:1px solid #232c40;border-radius:5px;padding:1px 5px;font-family:inherit;
}
.results{
  position:absolute;top:44px;left:0;right:0;background:#0b101b;border:1px solid #222b40;border-radius:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.55);padding:6px;display:none;max-height:330px;overflow:auto;z-index:50;
}
.results.show{display:block}
.result{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer}
.result:hover,.result.active{background:#141b2c}
.result .dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto}
.result .nm{font-size:12.5px;color:#d3dcee;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .rg{font-size:10.5px;color:#6a7590;white-space:nowrap}
.results .empty{padding:14px;text-align:center;color:#5d6880;font-size:12px}

.btn{
  height:36px;padding:0 14px;border-radius:10px;border:1px solid #1e2638;background:#0c111c;
  font-size:12.5px;color:#c4cee2;display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:#121a2a;border-color:#2a3450;color:#e6edfb}
.btn.primary{background:linear-gradient(180deg,#2b3f8f,#22337a);border-color:#3a4f9f;color:#e9eeff}
.btn.primary:hover{background:linear-gradient(180deg,#33499f,#263a86)}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
.btn svg{opacity:.8}

/* ---------- shell ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- sidebar ---------- */
.sidebar{
  width:296px;flex:0 0 296px;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,#090c14 0%,#070910 100%);
  z-index:20;
}
.sidebar-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 8px}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.sec-h .t{font-size:11px;letter-spacing:.16em;color:#6d7891}
.sec-h .e{font-size:9px;letter-spacing:.16em;color:#39445c}

.row{
  display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;
  transition:background .12s;user-select:none;
}
.row:hover{background:#10151f}
.row.off{opacity:.36}
.row .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 10px currentColor}
.row .nm{font-size:12.5px;color:#c2ccdf;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{font-size:11px;color:#5f6a82;font-variant-numeric:tabular-nums}
.row .eye{opacity:0;font-size:10px;color:#6d7891}
.row:hover .eye{opacity:1}

.kind-row .line{width:26px;height:2px;flex:0 0 auto;position:relative;border-radius:2px}
.kind-row .line.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 8px)!important}

/* regions */
.region-row{padding:7px 8px;align-items:center}
.region-row .num{font-size:9.5px;color:#48536c;width:16px;flex:0 0 auto;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.region-row .nm{font-size:12.5px;color:#c2ccdf;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.region-row .ct{font-size:10.5px;color:#5a6580;font-variant-numeric:tabular-nums}
.region-row .bar{position:absolute;left:24px;right:8px;bottom:3px;height:2px;background:#141b28;border-radius:2px;overflow:hidden}
.region-row{position:relative}
.region-row .bar i{display:block;height:100%;background:linear-gradient(90deg,#3ddc97,#5ee0b3);border-radius:2px}

/* footer */
.sidebar-foot{padding:12px 16px 16px;border-top:1px solid var(--line);background:#080b12}
.progress-card{display:flex;align-items:center;gap:13px;margin-bottom:12px}
.ring-wrap{position:relative;width:54px;height:54px;flex:0 0 auto}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:#dbe4f7;font-variant-numeric:tabular-nums}
.progress-meta .big{font-size:12.5px;color:#cdd7ea}
.progress-meta .big b{color:#8ff0c7;font-weight:600}
.progress-meta .sub{font-size:11px;color:#66718b;margin-top:4px}
.foot-btns{display:flex;gap:8px}
.foot-btns .btn{flex:1;justify-content:center;height:32px;font-size:12px}
.foot-links{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:9px;font-size:10.5px;color:#3f4a60}
.foot-links button{font-size:10.5px;color:#4d5870;padding:1px 2px}
.foot-links button:hover{color:#9aa6bf}
.foot-links span{color:#2b3446}
.link-reset:hover{color:#8b96ad}

/* ---------- canvas ---------- */
.main{position:relative;flex:1;min-width:0;overflow:hidden;background:#06080f}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
.main::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(3,5,10,.55) 100%);
}
.hint{
  position:absolute;left:18px;bottom:16px;z-index:8;font-size:11px;color:#5a6580;
  background:rgba(10,13,22,.72);border:1px solid #1a2133;border-radius:9px;padding:7px 11px;
  backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;pointer-events:none;
}
.hint b{color:#8492ad;font-weight:500}
.zoomctl{position:absolute;right:18px;bottom:16px;z-index:8;display:flex;flex-direction:column;gap:1px;background:#0b0f19;border:1px solid #1c2436;border-radius:10px;overflow:hidden}
.zoomctl button{width:32px;height:30px;display:grid;place-items:center;color:#8b96ad;font-size:15px}
.zoomctl button:hover{background:#141b2b;color:#e2e9f8}

/* ---------- detail panel ---------- */
.detail{
  position:absolute;top:16px;right:16px;bottom:16px;width:386px;z-index:20;
  background:rgba(10,14,23,.94);border:1px solid #1d2538;border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.55);backdrop-filter:blur(18px);
  transform:translateX(18px);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s;
  display:flex;flex-direction:column;overflow:hidden;
}
.detail.open{transform:none;opacity:1;pointer-events:auto}
.detail-head{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.badge{font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;border:1px solid;line-height:1.3}
.detail-region{font-size:10.5px;color:#6b7690;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#7c87a0;font-size:16px}
.icon-btn:hover{background:#161d2d;color:#dbe4f6}
.detail-body{overflow-y:auto;padding:10px 18px 18px;flex:1}
.detail h2{font-size:19px;line-height:1.4;margin:6px 0 10px;font-weight:600;letter-spacing:.01em}
.detail .desc{font-size:12.8px;line-height:1.75;color:#aab5cc;margin:0 0 12px}
.detail h4{font-size:10px;letter-spacing:.14em;color:#5d6880;font-weight:500;margin:18px 0 8px}
.tips{margin:0;padding:0;list-style:none}
.tips li{position:relative;padding-left:14px;font-size:12px;line-height:1.65;color:#9aa6bf;margin-bottom:5px}
.tips li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:2px;background:#4a5674}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{
  font-size:11px;color:#9fb0ff;text-decoration:none;background:#121a2e;border:1px solid #243055;
  padding:4px 8px;border-radius:7px;display:inline-flex;align-items:center;gap:5px;max-width:100%;
}
.links a:hover{background:#182341;border-color:#364a80;color:#c6d3ff}
.links a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:11.5px;color:#b7c3da;background:#111726;border:1px solid #1e273b;padding:4px 9px;border-radius:20px;
  display:inline-flex;align-items:center;gap:6px;transition:.12s;
}
.chip:hover{background:#172033;border-color:#2c3a58;color:#e6edfb}
.chip i{width:5px;height:5px;border-radius:50%;display:block}
.status{display:flex;gap:6px;background:#0c111c;border:1px solid #1a2233;border-radius:10px;padding:3px}
.status button{
  flex:1;height:28px;border-radius:7px;font-size:11.5px;color:#7f8ba4;display:flex;align-items:center;justify-content:center;gap:5px;
}
.status button:hover{color:#d5deef;background:#141b2b}
.status button.on[data-st="todo"]{background:#1a2233;color:#c8d2e6}
.status button.on[data-st="doing"]{background:rgba(240,180,95,.14);color:#f0b45f}
.status button.on[data-st="done"]{background:rgba(61,220,151,.13);color:#4fe0a5}
.note-label{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;gap:8px}
.note-label h4{margin:0}
.note-state{font-size:10px;color:#4f5a72}
.note-actions{display:flex;align-items:center;gap:8px}
.note-tabs{display:flex;gap:2px;background:#0b101a;border:1px solid #1a2233;border-radius:7px;padding:2px}
.note-tabs button{font-size:10.5px;padding:2px 8px;border-radius:5px;color:#77839c}
.note-tabs button:hover{color:#c6d2e6}
.note-tabs button.on{background:#1b2437;color:#dbe4f7}
textarea#note{
  width:100%;min-height:190px;resize:vertical;background:#0a0e18;border:1px solid #1b2334;border-radius:10px;
  color:#d3dcee;font-size:12.3px;line-height:1.7;padding:10px 11px;outline:none;
  font-family:inherit;
}
textarea#note::placeholder{color:#4b5670}
textarea#note:focus{border-color:#33406b;box-shadow:0 0 0 3px rgba(110,130,255,.07)}
.note-hint{font-size:10px;color:#4b5670;margin-top:7px;line-height:1.6}
.note-preview{
  min-height:190px;max-height:440px;overflow:auto;background:#0a0e18;border:1px solid #1b2334;border-radius:10px;
  padding:12px 13px;font-size:12.3px;line-height:1.72;color:#c3cee1;
}
.note-preview[hidden]{display:none}
.note-preview p{margin:0 0 9px}
.note-preview p:last-child{margin-bottom:0}
.note-preview h1,.note-preview h2,.note-preview h3,.note-preview h4{color:#e4ecfb;margin:14px 0 7px;line-height:1.4}
.note-preview h1{font-size:17px}
.note-preview h2{font-size:15px}
.note-preview h3{font-size:13.5px}
.note-preview h4{font-size:12.5px;color:#cbd6ea}
.note-preview h5{font-size:12px;color:#c6d1e6;margin:12px 0 6px}
.note-preview h6{font-size:11.5px;color:#b9c5db;margin:10px 0 5px}
.note-preview ul,.note-preview ol{margin:6px 0 10px;padding-left:20px}
.note-preview li{margin:3px 0}
.note-preview code{
  background:#131a28;border:1px solid #1e2839;border-radius:4px;padding:1px 4px;
  font-family:"Cascadia Code","Consolas","SF Mono",monospace;font-size:11.5px;color:#a9d5ff;
}
.note-preview pre{
  background:#070b13;border:1px solid #1a2334;border-radius:8px;padding:10px 11px;overflow:auto;margin:9px 0;
}
.note-preview pre code{background:none;border:0;padding:0;color:#cfe3ff;font-size:11.3px;line-height:1.6;white-space:pre-wrap;word-break:break-word}.note-preview .table-wrap{overflow-x:auto;margin:10px 0}
.note-preview table{border-collapse:collapse;min-width:100%;font-size:11.5px}
.note-preview th,.note-preview td{border:1px solid #202a3d;padding:5px 8px;vertical-align:top}
.note-preview th{background:#121a2a;color:#d8e2f4;font-weight:600;white-space:nowrap}
.note-preview tr:nth-child(even) td{background:rgba(255,255,255,.018)}
.note-preview li.task{list-style:none;margin-left:-18px}
.note-preview .cb{display:inline-flex;width:13px;height:13px;border:1px solid #55637f;background:rgba(255,255,255,.04);border-radius:3px;margin-right:7px;vertical-align:-2px;align-items:center;justify-content:center;font-size:9px;line-height:1;color:#06101a}
.note-preview .cb.on{background:#3ddc97;border-color:#3ddc97}
.note-preview img{max-width:100%;border-radius:8px;border:1px solid #1e2738;margin:8px 0;display:block}
.note-preview blockquote{margin:9px 0;padding:4px 11px;border-left:2px solid #38466b;color:#9aa7bf}
.note-preview blockquote p{margin:0}
.note-preview a{color:#9fb0ff;text-decoration:none;border-bottom:1px dotted #3d4d7a}
.note-preview a:hover{color:#c6d3ff}
.note-preview hr{border:0;border-top:1px solid #1d2638;margin:14px 0}
.note-preview strong{color:#e8effc}
.note-preview del{color:#8b96ab;text-decoration:line-through;text-decoration-color:rgba(255,132,150,.9);text-decoration-thickness:1.5px}
.note-preview mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.note-preview mjx-container[display="true"]{margin:10px 0 !important}
.note-preview .md-empty{color:#4f5a72;font-size:12px}
.detail-foot{padding:10px 18px;border-top:1px solid #161d2c;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#4f5a72;background:#090d16}
.foot-loc{color:#7f8da8;display:inline-flex;align-items:center;gap:5px}
.foot-loc:hover{color:#c3cfe6}

/* toast */
#toast{
  position:fixed;left:50%;bottom:70px;transform:translate(-50%,14px);z-index:100;
  background:#121a2b;border:1px solid #27324c;color:#d5deef;font-size:12px;padding:9px 16px;border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.menu-btn{
  display:none;width:34px;height:34px;border:1px solid #1e2638;border-radius:9px;
  color:#aeb9cf;align-items:center;justify-content:center;flex:0 0 auto;background:#0c111c;
}
.menu-btn:hover{background:#121a2a;color:#e6edfb}
.scrim{
  position:fixed;inset:0;background:rgba(3,5,10,.62);z-index:55;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.show{opacity:1;pointer-events:auto}

@media (max-width:1180px){
  .stats{display:none}
  .search{width:230px;flex:0 1 230px}
  .sidebar{width:262px;flex-basis:262px}
}
@media (max-width:860px){
  .menu-btn{display:flex}
  .sidebar{
    position:fixed;left:0;top:62px;bottom:0;z-index:60;display:flex;
    width:300px;flex-basis:300px;transform:translateX(-102%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);
    box-shadow:24px 0 60px rgba(0,0,0,.55);
  }
  .sidebar.open{transform:none}
  .detail{width:auto;left:10px;right:10px;top:10px;bottom:10px}
  .brand-text span{display:none}
  .brand-text h1{font-size:13.5px;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .globalbar{gap:10px;padding:0 12px}
  .search{width:auto;flex:1;min-width:0}
  .search kbd{display:none}
  .hint{display:none}
  .zoomctl{bottom:12px;right:12px}
  .globalbar > .btn#btnFit span{display:none}
  .globalbar > .btn#btnFit{padding:0 10px}
  #toast{left:12px;right:12px;bottom:14px;transform:translateY(14px);max-width:none;text-align:center}
  #toast.show{transform:none}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
  <header class="globalbar">
    <div class="brand">
      <div class="logo">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
          <path d="M6 17.2V9.4L12 5l6 4.4v7.8" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/>
          <circle cx="6" cy="17.4" r="2.1" fill="#fff"/>
          <circle cx="18" cy="17.4" r="2.1" fill="#fff"/>
          <circle cx="12" cy="4.8" r="2.1" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>大模型学习路线</h1>
        <span>LLM FIELD ATLAS</span>
      </div>
    </div>
    <button class="menu-btn" id="btnMenu" title="菜单" aria-label="打开侧栏">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="stats" id="stats"></div>
    <div class="grow"></div>
    <div class="search" id="searchWrap">
      <svg class="sicon" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="#8b96ad" stroke-width="1.7"/><path d="M16 16l4 4" stroke="#8b96ad" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="searchInput" placeholder="搜索节点、资料、概念…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
      <div class="results" id="results"></div>
    </div>

const nodes = NODES.map(n => Object.assign({}, n, {x:0, y:0, deg:0}));
const byId = new Map(nodes.map(n => [n.id, n]));
const edges = [];
EDGES.forEach(pair => {
  const a = byId.get(pair[0]), b = byId.get(pair[1]);
  if (a && b && a !== b) {
    edges.push({a:a, b:b, kind:pair[2]});
    a.deg++; b.deg++;
  }
});

const state = {
  layers:{concept:true, resource:true, project:true, skill:true, check:true},
  kinds:{prereq:true, source:true, related:true, produce:true},
  hover:null,
  selected:null,
  query:'',
  results:[],
  resultIndex:-1
};

const canvas = document.getElementById('graph');
const stage = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const detail = document.getElementById('detail');
const detailBody = document.getElementById('detailBody');
const searchInput = document.getElementById('searchInput');
const resultsBox = document.getElementById('results');
const toastEl = document.getElementById('toast');

let W = 0, H = 0, DPR = 1;
let needsRender = true;
const view = {x:0, y:0, zoom:0.67};
let draggingNode = null;
let panning = null;
let dragMoved = false;
let anim = null;
let userTouched = false;

const LABEL_FONT = '500 13.5px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
const LABEL_FONT_BOLD = '600 13.5px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';

/* =======================================================================
   本地存储
   ======================================================================= */
const LS_KEY = 'llm-atlas-v1';
let store = {v:1, nodes:{}};
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed && parsed.nodes) store = parsed;
  }
} catch (e) { /* 本地存储不可用时退化为内存 */ }

let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
    catch (e) { toast('本地存储不可用：笔记只保留在当前页面'); }
  }, 250);
}
function nodeState(id) {
  if (!store.nodes[id]) store.nodes[id] = {status:'todo', note:''};
  return store.nodes[id];
}
function statusOf(id) {
  const s = store.nodes[id];
  return s && s.status ? s.status : 'todo';
}
function noteOf(id) {
  const s = store.nodes[id];
  return s && s.note ? s.note : '';
}

/* =======================================================================
   布局：区域内力导向，盒子固定
   ======================================================================= */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function layout() {
  const rand = mulberry32(20261026);

  // 先把每个标签的宽度量出来：把「圆点 + 标签」当成一个矩形来排布
  ctx.font = LABEL_FONT;
  nodes.forEach(n => { n.lw = Math.min(ctx.measureText(n.label).width, 206); });

  REGIONS.forEach(r => {
    const list = nodes.filter(n => n.region === r.id);
    const cols = 3;
    const rows = Math.ceil(list.length / cols);
    list.forEach((n, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      n.x = r.x + 30 + (col + 0.5) * ((r.w - 60) / cols) + (rand() - 0.5) * 20;
      n.y = r.y + 66 + (row + 0.5) * ((r.h - 96) / Math.max(rows, 1)) + (rand() - 0.5) * 14;
    });
  });

  const ITER = 720;
  for (let it = 0; it < ITER; it++) {
    const cool = 1 - it / ITER;

    // 标签矩形互斥，保证文字不互相压住
    REGIONS.forEach(r => {
      const list = nodes.filter(n => n.region === r.id);
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i], b = list[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const px = (a.lw + b.lw) / 2 + 16 - Math.abs(dx);
          if (px <= 0) continue;
          const py = 44 - Math.abs(dy);
          if (py <= 0) continue;
          let sx = 0, sy = 0;
          if (px < py) sx = (dx >= 0 ? 1 : -1) * px * 0.55;
          else sy = (dy >= 0 ? 1 : -1) * py * 0.55;
          a.x -= sx; a.y -= sy; b.x += sx; b.y += sy;
        }
      }
    });

    // 区域内的关系把相关节点拉近
    edges.forEach(e => {
      if (e.a.region !== e.b.region) return;
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = Math.max(-2, Math.min(2, (d - 72) * 0.011)) * cool;
      const fx = dx / d * f, fy = dy / d * f;
      e.a.x += fx; e.a.y += fy; e.b.x -= fx; e.b.y -= fy;
    });

    // 轻微向区域中心收拢，并限制在框内
    nodes.forEach(n => {
      const r = regionById[n.region];
      const cx = r.x + r.w / 2, cy = r.y + 58 + (r.h - 78) / 2;
      n.x += (cx - n.x) * 0.0025;
      n.y += (cy - n.y) * 0.0025;
      const half = Math.min(n.lw / 2, r.w / 2 - 14);
      n.x = Math.max(r.x + 12 + half, Math.min(r.x + r.w - 12 - half, n.x));
      n.y = Math.max(r.y + 64, Math.min(r.y + r.h - 34, n.y));
    });
  }
}

/* =======================================================================
   视图与绘制
   ======================================================================= */
function resize() {
  const rect = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, rect.width);
  H = Math.max(1, rect.height);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (!userTouched && window.innerWidth > 860) fitView(false);
  needsRender = true;
}

function fitView(animate) {
  const pad = 40;
  const z = Math.min((W - pad * 2) / WORLD.w, (H - pad * 2) / WORLD.h);
  const target = {
    zoom: Math.max(0.16, Math.min(1.3, z)),
    x: (W - WORLD.w * z) / 2,
    y: (H - WORLD.h * z) / 2
  };
  if (animate) animateTo(target); else { view.x = target.x; view.y = target.y; view.zoom = target.zoom; needsRender = true; }
}

function animateTo(target) {
  if (anim) cancelAnimationFrame(anim.raf);
  const from = {x:view.x, y:view.y, zoom:view.zoom};
  const t0 = performance.now();
  const dur = 460;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    const e = ease(k);
    view.x = from.x + (target.x - from.x) * e;
    view.y = from.y + (target.y - from.y) * e;
    view.zoom = from.zoom + (target.zoom - from.zoom) * e;
    needsRender = true;
    if (k < 1) anim.raf = requestAnimationFrame(step); else anim = null;
  };
  anim = {raf:requestAnimationFrame(step)};
}

function focusRegionInstant(id) {
  const r = regionById[id];
  if (!r) { fitView(false); return; }
  const z = Math.max(0.45, Math.min(1.15, Math.min((W - 40) / r.w, (H - 40) / r.h)));
  view.zoom = z;
  view.x = W / 2 - (r.x + r.w / 2) * z;
  view.y = H / 2 - (r.y + r.h / 2) * z;
  needsRender = true;
}

function flyToNode(id, zoomTarget) {
  const n = byId.get(id);
  if (!n) return;
  const z = Math.max(0.85, Math.min(1.25, zoomTarget || view.zoom));
  const panelW = detail.classList.contains('open') ? 200 : 0;
  animateTo({
    zoom: z,
    x: W / 2 - panelW - n.x * z,
    y: H / 2 - n.y * z
  });
}

function flyToRegion(r) {
  userTouched = true;
  const z = Math.max(0.55, Math.min(1.25, Math.min((W - 120) / r.w, (H - 120) / r.h)));
  animateTo({zoom:z, x:W / 2 - (r.x + r.w / 2) * z, y:H / 2 - (r.y + r.h / 2) * z});
  closeSidebarOnMobile();
}

function closeSidebarOnMobile() {
  if (window.innerWidth > 860) return;
  const sb = document.querySelector(".sidebar");
  const sc = document.getElementById("scrim");
  if (sb) sb.classList.remove("open");
  if (sc) sc.classList.remove("show");
}

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function isDimmed(n) {
  const focus = state.hover || state.selected;
  if (!focus) return false;
  if (n.id === focus) return false;
  return !edges.some(e => (e.a.id === focus && e.b.id === n.id) || (e.b.id === focus && e.a.id === n.id));
}

function nodeRadius(n) {
  return n.type === 'project' ? 8.5 : n.type === 'skill' ? 8 : 7;
}

function drawGrid() {
  const step = view.zoom < 0.5 ? 108 : view.zoom < 0.95 ? 72 : 48;
  const sp = step * view.zoom;
  const ox = ((view.x % sp) + sp) % sp;
  const oy = ((view.y % sp) + sp) % sp;
  ctx.fillStyle = 'rgba(126,146,196,0.085)';
  for (let x = ox; x < W; x += sp) {
    for (let y = oy; y < H; y += sp) {
      ctx.fillRect(x, y, 1.1, 1.1);
    }
  }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, W, H);
  drawGrid();

  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.zoom, view.zoom);

  const focus = state.hover || state.selected;

  // 跨区域关系先画（在盒子下层）
  edges.forEach(e => {
    if (!state.kinds[e.kind]) return;
    if (e.a.region === e.b.region) return;
    if (e.kind === 'related' && !(state.hover || state.selected)) return;
    drawEdge(e, focus, true);
  });

  drawRegions();

  // 区域内关系
  edges.forEach(e => {
    if (!state.kinds[e.kind]) return;
    if (e.a.region !== e.b.region) return;
    drawEdge(e, focus, false);
  });

  nodes.forEach(n => {
    if (!state.layers[n.type]) return;
    drawNode(n, focus);
  });

  drawLabels();
  ctx.restore();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  needsRender = false;
}

function drawRegions() {
  REGIONS.forEach((r, i) => {
    const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    g.addColorStop(0, 'rgba(16,22,36,0.72)');
    g.addColorStop(1, 'rgba(8,11,19,0.6)');
    ctx.fillStyle = g;
    roundRect(r.x, r.y, r.w, r.h, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(112,132,184,0.17)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 区域角落的一层很淡的色晕，用来区分不同板块
    ctx.save();
    roundRect(r.x, r.y, r.w, r.h, 14);
    ctx.clip();
    const rg = ctx.createRadialGradient(r.x + 46, r.y + 30, 0, r.x + 46, r.y + 30, r.w * 0.95);
    rg.addColorStop(0, hexA(r.accent, 0.07));
    rg.addColorStop(1, hexA(r.accent, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.restore();

    // 顶部高光
    ctx.save();
    roundRect(r.x, r.y, r.w, r.h, 14);
    ctx.clip();
    const hg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + 60);
    hg.addColorStop(0, 'rgba(120,145,220,0.07)');
    hg.addColorStop(1, 'rgba(120,145,220,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(r.x, r.y, r.w, 60);
    ctx.restore();

    ctx.fillStyle = r.accent;
    ctx.globalAlpha = 0.9;
    roundRect(r.x + 16, r.y + 15, 3, 13, 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.font = '600 14px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(219,228,246,0.94)';
    ctx.fillText(r.name, r.x + 27, r.y + 22);

    const cnt = nodes.filter(n => n.region === r.id).length;
    ctx.font = '10.5px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(125,140,172,0.75)';
    ctx.textAlign = 'right';
    ctx.fillText(cnt + ' 节点', r.x + r.w - 16, r.y + 22);

    ctx.fillStyle = 'rgba(90,104,134,0.4)';
    ctx.font = '9px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(String(i + 1).padStart(2, '0'), r.x + r.w - 16, r.y + r.h - 12);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  });
}

function edgeGeometry(e) {
  const a = e.a, b = e.b;
  const ra = nodeRadius(a) + 2, rb = nodeRadius(b) + 5;
  let dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const ux = dx / len, uy = dy / len;
  const sx = a.x + ux * ra, sy = a.y + uy * ra;
  const ex = b.x - ux * rb, ey = b.y - uy * rb;
  let cx = 0, cy = 0, curved = false;

  if (a.region !== b.region) {
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const off = Math.min(90, len * 0.16);
    cx = mx - dy / len * off;
    cy = my + dx / len * off;
    curved = true;
  }
  return {sx, sy, ex, ey, cx, cy, curved};
}

function drawEdge(e, focus, cross) {
  if (!state.layers[e.a.type] || !state.layers[e.b.type]) return;
  const kind = KINDS[e.kind];
  const g = edgeGeometry(e);

  const active = focus && (e.a.id === focus || e.b.id === focus);
  let alpha = cross ? 0.16 : 0.46;
  if (focus && !active) alpha = 0.12;
  if (active) alpha = 0.85;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = kind.color;
  ctx.lineWidth = active ? 1.7 : (cross ? 0.9 : 1.15);
  if (kind.dash) ctx.setLineDash([3.5, 5]);

  ctx.beginPath();
  ctx.moveTo(g.sx, g.sy);
  if (g.curved) ctx.quadraticCurveTo(g.cx, g.cy, g.ex, g.ey);
  else ctx.lineTo(g.ex, g.ey);
  ctx.stroke();
  ctx.setLineDash([]);

  if (kind.arrow && (!focus || active)) {
    let tx, ty;
    if (g.curved) { tx = g.ex - g.cx; ty = g.ey - g.cy; }
    else { tx = g.ex - g.sx; ty = g.ey - g.sy; }
    const l = Math.sqrt(tx * tx + ty * ty) || 1;
    tx /= l; ty /= l;
    const size = active ? 6.5 : 5.5;
    ctx.fillStyle = kind.color;
    ctx.beginPath();
    ctx.moveTo(g.ex, g.ey);
    ctx.lineTo(g.ex - tx * size - ty * size * 0.45, g.ey - ty * size + tx * size * 0.45);
    ctx.lineTo(g.ex - tx * size + ty * size * 0.45, g.ey - ty * size - tx * size * 0.45);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawNode(n, focus) {
  const t = TYPES[n.type];
  const r = nodeRadius(n);
  const dim = isDimmed(n);
  const active = n.id === state.hover || n.id === state.selected;
  const st = statusOf(n.id);

  ctx.save();
  ctx.globalAlpha = dim ? (state.selected ? 0.4 : 0.3) : 1;

  if (active) {
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 16;
  }

  ctx.fillStyle = t.color;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;

  if (n.type === 'concept') {
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.9; ctx.stroke();
  } else if (n.type === 'resource') {
    ctx.beginPath();
    roundRect(n.x - r, n.y - r, r * 2, r * 2, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 0.9; ctx.stroke();
  } else if (n.type === 'project') {
    ctx.beginPath();
    ctx.moveTo(n.x, n.y - r);
    ctx.lineTo(n.x + r, n.y);
    ctx.lineTo(n.x, n.y + r);
    ctx.lineTo(n.x - r, n.y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  } else if (n.type === 'skill') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI / 6 + i * Math.PI / 3;
      const px = n.x + Math.cos(ang) * r, py = n.y + Math.sin(ang) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.9; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(n.x, n.y, r - 1, 0, Math.PI * 2);
    ctx.strokeStyle = t.color; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(n.x, n.y, 1.7, 0, Math.PI * 2);
    ctx.fillStyle = t.color; ctx.fill();
  }

  ctx.shadowBlur = 0;

  // 学习状态
  if (st !== 'todo') {
    ctx.beginPath();
    ctx.strokeStyle = st === 'done' ? '#3ddc97' : '#f0b45f';
    ctx.lineWidth = 1.5;
    ctx.arc(n.x, n.y, r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (st === 'done' ? 1 : 0.42));
    ctx.stroke();
  }

  // 写过笔记的节点右上角加一个小点
  if (noteOf(n.id)) {
    ctx.beginPath();
    ctx.fillStyle = '#7dd3fc';
    ctx.arc(n.x + r + 2, n.y - r - 2, 1.9, 0, Math.PI * 2);
    ctx.fill();
  }

  if (active) {
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.arc(n.x, n.y, r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function labelVisible(n) {
  if (view.zoom >= 0.62) return true;
  if (view.zoom >= 0.42) return n.type !== 'concept' || n.deg >= 3;
  return n.type === 'project' || n.type === 'skill' || n.type === 'check';
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function drawLabels() {
  const focus = state.hover || state.selected;
  const placed = [];

  // 预留区域标题与所有节点图形的位置
  REGIONS.forEach(r => placed.push({x:r.x + 14, y:r.y + 12, w:r.w - 28, h:20}));
  nodes.forEach(n => {
    if (state.layers[n.type]) placed.push({x:n.x - 9, y:n.y - 9, w:18, h:18});
  });

  const order = nodes.filter(n => state.layers[n.type]).slice().sort((a, b) => {
    const wa = (a.type === 'project' || a.type === 'skill') ? 9 : a.type === 'check' ? 7 : a.type === 'resource' ? 5 : 3;
    const wb = (b.type === 'project' || b.type === 'skill') ? 9 : b.type === 'check' ? 7 : b.type === 'resource' ? 5 : 3;
    return (wb + b.deg * 0.4) - (wa + a.deg * 0.4);
  });

  order.forEach(n => {
    const forced = n.id === focus;
    if (!forced && !labelVisible(n)) return;

    const r = regionById[n.region];
    ctx.font = forced ? LABEL_FONT_BOLD : LABEL_FONT;
    const tw = ctx.measureText(n.label).width;
    const bx = clamp(n.x - tw / 2, r.x + 8, r.x + r.w - 8 - tw);

    const cands = [
      {x:bx, y:n.y + 11, w:tw, h:18},
      {x:bx, y:n.y - 27, w:tw, h:18},
      {x:n.x + 12, y:n.y - 9, w:tw, h:18},
      {x:n.x - 12 - tw, y:n.y - 9, w:tw, h:18}
    ];

    let chosen = null;
    for (const c of cands) {
      if (c.x < r.x + 6 || c.x + c.w > r.x + r.w - 6) continue;
      if (c.y < r.y + 6 || c.y + c.h > r.y + r.h - 4) continue;
      let hit = false;
      for (const p of placed) {
        if (c.x < p.x + p.w && c.x + c.w > p.x && c.y < p.y + p.h && c.y + c.h > p.y) { hit = true; break; }
      }
      if (!hit) { chosen = c; break; }
    }
    if (!chosen) return;
    placed.push(chosen);

    ctx.save();
    ctx.globalAlpha = isDimmed(n) ? (state.selected ? 0.3 : 0.2) : 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    if (forced) {
      ctx.fillStyle = 'rgba(9,13,22,0.94)';
      roundRect(chosen.x - 5, chosen.y - 2, tw + 10, 20, 5);
      ctx.fill();
    }
    // 文字描边，避免连线从字里穿过
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.4;
    ctx.strokeStyle = 'rgba(5,7,12,0.88)';
    ctx.strokeText(n.label, chosen.x, chosen.y + 13);
    ctx.fillStyle = forced ? '#ffffff' : 'rgba(198,211,232,0.94)';
    ctx.fillText(n.label, chosen.x, chosen.y + 13);
    ctx.restore();
  });
}

/* =======================================================================
   交互
   ======================================================================= */
function toWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left - view.x) / view.zoom,
    y: (clientY - rect.top - view.y) / view.zoom
  };
}

function hitTest(p) {
  let best = null, bestD = 18 * 18;
  const z = view.zoom;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!state.layers[n.type]) continue;
    const dx = (p.x - n.x) * z, dy = (p.y - n.y) * z;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD) { bestD = d2; best = n; }
  }
  return best;
}

const activePointers = new Map();
let pinch = null;

function pinchInfo() {
  const pts = Array.from(activePointers.values());
  const a = pts[0], b = pts[1];
  return {
    dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    mid: {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2}
  };
}

canvas.addEventListener('pointerdown', e => {
  userTouched = true;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if (activePointers.size === 2) {
    // 第二根手指落下：切换成双指缩放
    draggingNode = null;
    panning = null;
    const rect = canvas.getBoundingClientRect();
    const info = pinchInfo();
    const mx = info.mid.x - rect.left, my = info.mid.y - rect.top;
    pinch = {
      dist: info.dist,
      zoom: view.zoom,
      wx: (mx - view.x) / view.zoom,
      wy: (my - view.y) / view.zoom
    };
    canvas.classList.add('dragging');
    return;
  }
  if (activePointers.size > 2) return;

  const p = toWorld(e.clientX, e.clientY);
  const n = hitTest(p);
  dragMoved = false;
  if (n) {
    draggingNode = {node:n, dx:p.x - n.x, dy:p.y - n.y};
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  } else {
    panning = {sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y};
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  }
});

canvas.addEventListener('pointermove', e => {
  if (activePointers.has(e.pointerId)) {
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }

  if (pinch && activePointers.size >= 2) {
    const info = pinchInfo();
    const rect = canvas.getBoundingClientRect();
    const mx = info.mid.x - rect.left, my = info.mid.y - rect.top;
    const z = Math.max(0.22, Math.min(3, pinch.zoom * (info.dist / pinch.dist)));
    view.zoom = z;
    view.x = mx - pinch.wx * z;
    view.y = my - pinch.wy * z;
    needsRender = true;
    return;
  }

  const p = toWorld(e.clientX, e.clientY);
  if (draggingNode) {
    const n = draggingNode.node;
    const r = regionById[n.region];
    n.x = Math.max(r.x + 30, Math.min(r.x + r.w - 30, p.x - draggingNode.dx));
    n.y = Math.max(r.y + 58, Math.min(r.y + r.h - 24, p.y - draggingNode.dy));
    dragMoved = true;
    needsRender = true;
    return;
  }
  if (panning) {
    view.x = panning.ox + (e.clientX - panning.sx);
    view.y = panning.oy + (e.clientY - panning.sy);
    if (Math.abs(e.clientX - panning.sx) + Math.abs(e.clientY - panning.sy) > 3) dragMoved = true;
    needsRender = true;
    return;
  }
  const n = hitTest(p);
  const id = n ? n.id : null;
  if (id !== state.hover) {
    state.hover = id;
    canvas.style.cursor = n ? 'pointer' : 'grab';
    needsRender = true;
  }
});

function endPointer(e) {
  activePointers.delete(e.pointerId);
  if (pinch) {
    if (activePointers.size < 2) {
      pinch = null;
      canvas.classList.remove('dragging');
    }
    return;
  }
  if (draggingNode) {
    if (!dragMoved) selectNode(draggingNode.node.id);
    draggingNode = null;
    needsRender = true;
  } else if (panning) {
    if (!dragMoved && !hitTest(toWorld(e.clientX, e.clientY))) {
      closePanel();
    }
    panning = null;
    needsRender = true;
  }
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e => {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) pinch = null;
  draggingNode = null; panning = null; canvas.classList.remove('dragging');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  userTouched = true;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - view.x) / view.zoom, wy = (my - view.y) / view.zoom;
  const factor = Math.exp(-e.deltaY * 0.0014);
  const nz = Math.max(0.22, Math.min(3, view.zoom * factor));
  view.x = mx - wx * nz;
  view.y = my - wy * nz;
  view.zoom = nz;
  needsRender = true;
}, {passive:false});

canvas.addEventListener('dblclick', e => {
  const p = toWorld(e.clientX, e.clientY);
  const r = REGIONS.find(rr => p.x > rr.x && p.x < rr.x + rr.w && p.y > rr.y && p.y < rr.y + rr.h);
  if (r) flyToRegion(r); else fitView(true);
});

document.getElementById('zin').addEventListener('click', () => {
  userTouched = true;
  const z = Math.min(3, view.zoom * 1.25);
  const cx = W / 2, cy = H / 2;
  view.x = cx - (cx - view.x) * (z / view.zoom);
  view.y = cy - (cy - view.y) * (z / view.zoom);
  view.zoom = z; needsRender = true;
});
document.getElementById('zout').addEventListener('click', () => {
  userTouched = true;
  const z = Math.max(0.22, view.zoom / 1.25);
  const cx = W / 2, cy = H / 2;
  view.x = cx - (cx - view.x) * (z / view.zoom);
  view.y = cy - (cy - view.y) * (z / view.zoom);
  view.zoom = z; needsRender = true;
});

/* =======================================================================
   详情面板
   ======================================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function selectNode(id) {
  if (state.selected !== id) noteTabMode = 'edit';
  state.selected = id;
  state.hover = null;
  needsRender = true;
  renderPanel();
  detail.classList.add('open');
  detail.setAttribute('aria-hidden', 'false');
}

function closePanel() {
  state.selected = null;
  detail.classList.remove('open');
  detail.setAttribute('aria-hidden', 'true');
  needsRender = true;
}

function neighborsOf(id) {
  const list = [];
  edges.forEach(e => {
    if (e.a.id === id) list.push({node:e.b, kind:e.kind});
    else if (e.b.id === id) list.push({node:e.a, kind:e.kind});
  });
  return list;
}

/* =======================================================================
   笔记渲染：Markdown + 代码块 + LaTeX
   ======================================================================= */
let noteTabMode = 'edit';

function typesetMath(el) {
  if (!el) return;
  const MJ = window.MathJax;
  if (!MJ || !MJ.startup || !MJ.startup.promise) return;
  try {
    MJ.startup.promise.then(function () {
      return MJ.typesetPromise([el]);
    }).catch(function () {});
  } catch (e) { /* 忽略渲染错误，保留原文 */ }
}

function renderMarkdown(src) {
  const raw = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
  if (!raw.trim()) return '<div class="md-empty">还没有笔记。切回「编辑」，可以用 Markdown 写说明、贴代码、写 LaTeX 公式。</div>';

  const codeBlocks = [];
  const mathBlocks = [];
  let text = raw;

  // 先保护代码块和公式，避免被 Markdown 规则误伤
  text = text.replace(/```([^\n`]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    codeBlocks.push({lang: String(lang).trim(), code: code.replace(/\n$/, '')});
    return '\u0000C' + (codeBlocks.length - 1) + '\u0000';
  });

  const pushMath = (display, body) => {
    mathBlocks.push({display: display, body: body});
    return '\u0000M' + (mathBlocks.length - 1) + '\u0000';
  };
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, b) => pushMath(true, b));
  text = text.replace(/\\\[([\s\S]+?)\\\]/g, (m, b) => pushMath(true, b));
  text = text.replace(/\\\(([\s\S]+?)\\\)/g, (m, b) => pushMath(false, b));
  text = text.replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (m, pre, b) => pre + pushMath(false, b));

  text = esc(text);

  const codeHtml = i => {
    const c = codeBlocks[i];
    return '<pre><code>' + esc(c.code) + '</code></pre>';
  };
  const mathHtml = i => {
    const mm = mathBlocks[i];
    return esc(mm.display ? '$$' + mm.body + '$$' : '$' + mm.body + '$');
  };

  function inline(s) {
    const spans = [];
    s = s.replace(/`([^`]+)`/g, (m, c) => {
      spans.push(c);
      return '\u0001' + (spans.length - 1) + '\u0001';
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
      if (/^[a-z][a-z0-9+.-]*:/i.test(url) && !/^https?:/i.test(url)) return alt;
      return '<img src="' + url + '" alt="' + alt + '" loading="lazy">';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
      const ok = /^(https?:\/\/|mailto:|\/|#)/i.test(url) ? url : '#';
      return '<a href="' + ok + '" target="_blank" rel="noopener">' + label + '</a>';
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/＊＊([^＊\n]+)＊＊/g, '<strong>$1</strong>');
    s = s.replace(/＊([^＊\n]+)＊/g, '<em>$1</em>');
    s = s.replace(/(~~|～～|〜〜|˜˜|∼∼)([^\n]+?)\1/g, '<del>$2</del>');
    s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + spans[+i] + '</code>');
    return s;
  }

  const lines = text.split('\n');
  let out = '';
  let para = [];
  let listType = null;
  let listItems = [];

  const flushPara = () => {
    if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; }
  };
  const flushList = () => {
    if (listType) {
      out += '<' + listType + '>';
      listItems.forEach(it => {
        if (typeof it === 'string') {
          out += '<li>' + inline(it) + '</li>';
        } else {
          out += '<li class="task"><span class="cb' + (it.checked ? ' on' : '') + '">' + (it.checked ? '✓' : '') + '</span>' + inline(it.text) + '</li>';
        }
      });
      out += '</' + listType + '>';
      listType = null; listItems = [];
    }
  };
  const flushAll = () => { flushPara(); flushList(); };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const t = line.trim();

    if (!t) { flushAll(); continue; }

    const codeOnly = t.match(/^\u0000C(\d+)\u0000$/);
    if (codeOnly) { flushAll(); out += codeHtml(+codeOnly[1]); continue; }

    const mathOnly = t.match(/^\u0000M(\d+)\u0000$/);
    if (mathOnly && mathBlocks[+mathOnly[1]].display) {
      flushAll();
      out += '<div class="math-block">' + mathHtml(+mathOnly[1]) + '</div>';
      continue;
    }

    let m = t.match(/^(#{1,6})\s+(.*)$/);
    if (m) {
      flushAll();
      const lvl = Math.min(m[1].length + 2, 6);
      out += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>';
      continue;
    }

    if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { flushAll(); out += '<hr>'; continue; }

    if (t.slice(0, 4) === '&gt;') {
      flushAll();
      const buf = [];
      while (i < lines.length && lines[i].trim().slice(0, 4) === '&gt;') {
        buf.push(lines[i].trim().replace(/^&gt;\s?/, ''));
        i++;
      }
      i--;
      out += '<blockquote><p>' + buf.map(inline).join('<br>') + '</p></blockquote>';
      continue;
    }

    // 表格：| 表头 | ... | 下面一行是 |---|---|
    if (t.indexOf('|') >= 0 && i + 1 < lines.length) {
      const sepLine = lines[i + 1].trim();
      if (sepLine.indexOf('-') >= 0 && sepLine.indexOf('|') >= 0 && /^\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?$/.test(sepLine)) {
        flushAll();
        const splitRow = row => {
          let s = row.trim();
          if (s.charAt(0) === '|') s = s.slice(1);
          if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
          return s.split('|').map(c => c.trim());
        };
        const header = splitRow(t);
        const aligns = splitRow(sepLine).map(c => {
          const l = c.charAt(0) === ':', r = c.charAt(c.length - 1) === ':';
          return l && r ? 'center' : r ? 'right' : 'left';
        });
        i += 2;
        const rows = [];
        while (i < lines.length) {
          const row = lines[i].trim();
          if (!row || row.indexOf('|') < 0) break;
          rows.push(splitRow(row));
          i++;
        }
        i--;
        out += '<div class="table-wrap"><table><thead><tr>' +
          header.map((c, j) => '<th style="text-align:' + (aligns[j] || 'left') + '">' + inline(c) + '</th>').join('') +
          '</tr></thead><tbody>';
        rows.forEach(r => {
          out += '<tr>' + r.map((c, j) => '<td style="text-align:' + (aligns[j] || 'left') + '">' + inline(c) + '</td>').join('') + '</tr>';
        });
        out += '</tbody></table></div>';
        continue;
      }
    }

    m = t.match(/^[-*+]\s+(.*)$/);
    if (m) {
      if (listType !== 'ul') { flushAll(); listType = 'ul'; }
      const task = m[1].match(/^\[([ xX])\]\s+(.*)$/);
      if (task) {
        listItems.push({task:true, checked: task[1].toLowerCase() === 'x', text: task[2]});
      } else {
        listItems.push(m[1]);
      }
      continue;
    }

    m = t.match(/^\d+[.)]\s+(.*)$/);
    if (m) {
      if (listType !== 'ol') { flushAll(); listType = 'ol'; }
      listItems.push(m[1]);
      continue;
    }

    if (listType) flushList();
    para.push(t);
  }
  flushAll();

  // 恢复行内的代码与公式占位符
  out = out.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code>' + esc(codeBlocks[+i].code) + '</code>');
  out = out.replace(/\u0000M(\d+)\u0000/g, (m, i) => mathHtml(+i));

  return out;
}

function renderPanel() {
  const n = byId.get(state.selected);
  if (!n) return;
  const t = TYPES[n.type];
  const r = regionById[n.region];
  const st = statusOf(n.id);
  const note = noteOf(n.id);
  const related = neighborsOf(n.id).slice(0, 10);

  const linksHtml = (n.links || []).map(l =>
    '<a href="' + esc(l[1]) + '" target="_blank" rel="noopener"><svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>' + esc(l[0]) + '</span></a>'
  ).join('');

  const tipsHtml = (n.tips && n.tips.length)
    ? '<h4>要点</h4><ul class="tips">' + n.tips.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
    : '';

  const chips = related.map(x =>
    '<button class="chip" data-goto="' + esc(x.node.id) + '"><i style="background:' + TYPES[x.node.type].color + '"></i>' + esc(x.node.label) + '</button>'
  ).join('');

  detailBody.innerHTML =
    '<div class="detail-head">' +
      '<span class="badge" style="color:' + t.color + ';border-color:' + hexA(t.color, .45) + ';background:' + hexA(t.color, .1) + '">' + t.name + '</span>' +
      '<span class="detail-region">' + esc(r.name) + '</span>' +
      '<button class="icon-btn" id="panelClose" title="关闭">×</button>' +
    '</div>' +
    '<div class="detail-body">' +
      '<h2>' + esc(n.label) + '</h2>' +
      '<p class="desc">' + esc(n.desc) + '</p>' +
      tipsHtml +
      (linksHtml ? '<h4>资料入口</h4><div class="links">' + linksHtml + '</div>' : '') +
      (chips ? '<h4>关联节点</h4><div class="chips">' + chips + '</div>' : '') +
      '<h4>学习状态</h4>' +
      '<div class="status" id="statusBox">' +
        '<button data-st="todo" class="' + (st === 'todo' ? 'on' : '') + '">未开始</button>' +
        '<button data-st="doing" class="' + (st === 'doing' ? 'on' : '') + '">学习中</button>' +
        '<button data-st="done" class="' + (st === 'done' ? 'on' : '') + '">已掌握</button>' +
      '</div>' +
      '<div class="note-label"><h4>我的笔记</h4>' +
        '<div class="note-actions">' +
          '<span class="note-state" id="noteState">' + (note ? '已保存' : '自动保存到本地') + '</span>' +
          '<div class="note-tabs">' +
            '<button data-tab="edit">编辑</button>' +
            '<button data-tab="view">预览</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<textarea id="note" placeholder="支持 Markdown、代码块和 LaTeX：&#10;**粗体**、`行内代码`、```python 代码块```、$E=mc^2$"></textarea>' +
      '<div class="note-preview" id="notePreview" hidden></div>' +
      '<div class="note-hint">预览支持 Markdown（标题 / 列表 / 表格 / 勾选）· 代码块 · 行内公式 $…$ · 块级公式 $$…$$</div>' +
    '</div>' +
    '<div class="detail-foot">' +
      '<button class="foot-loc" id="panelLocate"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>定位到节点</button>' +
      '<span id="footHint">' + r.name + '</span>' +
    '</div>';

  detailBody.querySelector('#note').value = note;

  detailBody.querySelector('#panelClose').onclick = closePanel;
  detailBody.querySelector('#panelLocate').onclick = () => flyToNode(n.id, 1.05);

  detailBody.querySelectorAll('[data-goto]').forEach(btn => {
    btn.onclick = () => { selectNode(btn.getAttribute('data-goto')); flyToNode(btn.getAttribute('data-goto')); };
  });

  detailBody.querySelectorAll('#statusBox button').forEach(btn => {
    btn.onclick = () => {
      const s = nodeState(n.id);
      s.status = btn.getAttribute('data-st');
      persist();
      renderPanel();
      updateProgress();
      needsRender = true;
    };
  });

  const ta = detailBody.querySelector('#note');
  const prev = detailBody.querySelector('#notePreview');
  const tabBtns = detailBody.querySelectorAll('.note-tabs button');

  function applyNoteTab() {
    tabBtns.forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === noteTabMode));
    if (noteTabMode === 'view') {
      ta.hidden = true;
      prev.hidden = false;
      prev.innerHTML = renderMarkdown(ta.value);
      if (window.__mathjaxFailed) {
        prev.insertAdjacentHTML('beforeend', '<div class="md-empty" style="margin-top:10px">公式渲染文件 mathjax-tex-svg.js 没有加载，公式会以源码显示。</div>');
      }
      typesetMath(prev);
    } else {
      prev.hidden = true;
      ta.hidden = false;
    }
  }
  tabBtns.forEach(b => {
    b.onclick = () => {
      noteTabMode = b.getAttribute('data-tab');
      applyNoteTab();
    };
  });
  applyNoteTab();

  let tTimer = null;
  ta.addEventListener('input', () => {
    const s = nodeState(n.id);
    s.note = ta.value;
    const stEl = detailBody.querySelector('#noteState');
    if (stEl) stEl.textContent = '输入中…';
    clearTimeout(tTimer);
    tTimer = setTimeout(() => {
      persist();
      const el = detailBody.querySelector('#noteState');
      if (el) el.textContent = '已保存 ' + timeStr();
    }, 450);
  });
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function timeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* =======================================================================
   侧栏
   ======================================================================= */
function renderSidebar() {
  const layerList = document.getElementById('layerList');
  layerList.innerHTML = Object.keys(TYPES).map(k => {
    const t = TYPES[k];
    const cnt = nodes.filter(n => n.type === k).length;
    return '<div class="row layer-row' + (state.layers[k] ? '' : ' off') + '" data-layer="' + k + '">' +
      '<span class="dot" style="background:' + t.color + ';color:' + t.color + '"></span>' +
      '<span class="nm">' + t.name + '</span>' +
      '<span class="ct">' + cnt + '</span>' +
      '<span class="eye">' + (state.layers[k] ? '◉' : '○') + '</span>' +
    '</div>';
  }).join('');

  const kindList = document.getElementById('kindList');
  kindList.innerHTML = Object.keys(KINDS).map(k => {
    const kk = KINDS[k];
    const cnt = edges.filter(e => e.kind === k).length;
    return '<div class="row kind-row' + (state.kinds[k] ? '' : ' off') + '" data-kind="' + k + '">' +
      '<span class="line' + (kk.dash ? ' dash' : '') + '" style="background:' + kk.color + ';color:' + kk.color + '"></span>' +
      '<span class="nm">' + kk.name + '</span>' +
      '<span class="ct">' + cnt + '</span>' +
    '</div>';
  }).join('');

  const regionList = document.getElementById('regionList');
  regionList.innerHTML = REGIONS.map((r, i) => {
    const list = nodes.filter(n => n.region === r.id);
    const done = list.filter(n => statusOf(n.id) === 'done').length;
    const pct = Math.round(done / list.length * 100);
    return '<div class="row region-row" data-region="' + r.id + '" title="' + esc(r.en) + '">' +
      '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<span class="ct">' + list.length + '</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
    '</div>';
  }).join('');

  layerList.querySelectorAll('[data-layer]').forEach(el => {
    el.onclick = () => {
      const k = el.getAttribute('data-layer');
      state.layers[k] = !state.layers[k];
      renderSidebar();
      needsRender = true;
    };
  });
  kindList.querySelectorAll('[data-kind]').forEach(el => {
    el.onclick = () => {
      const k = el.getAttribute('data-kind');
      state.kinds[k] = !state.kinds[k];
      renderSidebar();
      needsRender = true;
    };
  });
  regionList.querySelectorAll('[data-region]').forEach(el => {
    el.onclick = () => flyToRegion(regionById[el.getAttribute('data-region')]);
  });
}

function updateProgress() {
  const total = nodes.length;
  const done = nodes.filter(n => statusOf(n.id) === 'done').length;
  const doing = nodes.filter(n => statusOf(n.id) === 'doing').length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const ring = document.getElementById('ring');
  const C = 2 * Math.PI * 22;
  ring.style.strokeDashoffset = String(C * (1 - done / total));
  document.getElementById('ringNum').textContent = pct + '%';
  document.getElementById('doneCount').textContent = done;
  document.getElementById('allCount').textContent = total;
  document.getElementById('doingText').textContent = '进行中 ' + doing + ' · 未开始 ' + (total - done - doing);
  updateStats();
}

function updateStats() {
  document.getElementById('stats').innerHTML =
    '<b>' + nodes.length + '</b> 节点 <span class="sep">·</span> <b>' + edges.length +
    '</b> 关系 <span class="sep">·</span> <b>' + REGIONS.length + '</b> 区域';
}

/* =======================================================================
   搜索
   ======================================================================= */
function doSearch(q) {
  const query = q.trim().toLowerCase();
  state.query = query;
  if (!query) { hideResults(); return; }
  const res = nodes.filter(n => {
    const region = regionById[n.region];
    return (n.label + ' ' + n.desc + ' ' + (n.tags || []).join(' ') + ' ' + region.name).toLowerCase().indexOf(query) >= 0;
  }).slice(0, 8);
  state.results = res;
  state.resultIndex = res.length ? 0 : -1;
  if (!res.length) {
    resultsBox.innerHTML = '<div class="empty">没有匹配的节点</div>';
    resultsBox.classList.add('show');
    return;
  }
  resultsBox.innerHTML = res.map((n, i) => {
    const t = TYPES[n.type];
    return '<div class="result' + (i === 0 ? ' active' : '') + '" data-id="' + n.id + '">' +
      '<span class="dot" style="background:' + t.color + '"></span>' +
      '<span class="nm">' + esc(n.label) + '</span>' +
      '<span class="rg">' + esc(regionById[n.region].name) + '</span>' +
    '</div>';
  }).join('');
  resultsBox.classList.add('show');
  resultsBox.querySelectorAll('.result').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-id');
      hideResults();
      searchInput.blur();
      selectNode(id);
      flyToNode(id);
    };
  });
}

function hideResults() {
  resultsBox.classList.remove('show');
  state.results = [];
  state.resultIndex = -1;
}
function moveResult(dir) {
  const items = resultsBox.querySelectorAll('.result');
  if (!items.length) return;
  state.resultIndex = (state.resultIndex + dir + items.length) % items.length;
  items.forEach((el, i) => el.classList.toggle('active', i === state.resultIndex));
  items[state.resultIndex].scrollIntoView({block:'nearest'});
}
function chooseResult() {
  if (state.resultIndex < 0 || !state.results[state.resultIndex]) return;
  const id = state.results[state.resultIndex].id;
  hideResults();
  searchInput.blur();
  selectNode(id);
  flyToNode(id);
}

searchInput.addEventListener('input', () => doSearch(searchInput.value));
searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) doSearch(searchInput.value); });
searchInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveResult(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveResult(-1); }
  else if (e.key === 'Enter') { e.preventDefault(); chooseResult(); }
  else if (e.key === 'Escape') { hideResults(); searchInput.blur(); }
});
document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target)) hideResults();
});

/* =======================================================================
   导出 / 重置
   ======================================================================= */
function exportNotes() {
  const date = new Date();
  const iso = date.toISOString().slice(0, 10);
  const lines = [];
  lines.push('---');
  lines.push('title: 大模型学习路线 · 知识图谱笔记');
  lines.push('created: ' + iso);
  lines.push('tags:');
  lines.push('  - 学习路线');
  lines.push('  - 知识图谱');
  lines.push('  - 大模型');
  lines.push('---');
  lines.push('');
  lines.push('# 大模型学习路线 · 知识图谱笔记');
  lines.push('');
  const done = nodes.filter(n => statusOf(n.id) === 'done').length;
  lines.push('> 进度：已掌握 ' + done + ' / ' + nodes.length + ' 节点，导出于 ' + date.toLocaleString('zh-CN') + '。');
  lines.push('');

  REGIONS.forEach(r => {
    const list = nodes.filter(n => n.region === r.id);
    const touched = list.filter(n => statusOf(n.id) !== 'todo' || noteOf(n.id));
    lines.push('## ' + r.name);
    lines.push('');
    if (!touched.length) {
      lines.push('- 暂无记录');
      lines.push('');
      return;
    }
    touched.forEach(n => {
      const st = statusOf(n.id);
      const box = st === 'done' ? '[x]' : '[ ]';
      lines.push('- ' + box + ' [[' + n.label + ']] · ' + TYPES[n.type].name +
        (st === 'doing' ? ' · 学习中' : ''));
      if (noteOf(n.id)) {
        noteOf(n.id).split('\n').forEach(l => lines.push('  ' + l));
      }
    });
    lines.push('');
  });

  lines.push('---');
  lines.push('');
  lines.push('## 全部节点索引');
  lines.push('');
  REGIONS.forEach(r => {
    lines.push('### ' + r.name);
    lines.push(nodes.filter(n => n.region === r.id).map(n => '[[' + n.label + ']]').join(' · '));
    lines.push('');
  });

  const blob = new Blob([lines.join('\n')], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '大模型学习路线-知识图谱笔记.md';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  toast('已导出 Markdown，可直接放进 Obsidian');
}

function exportBackup() {
  const payload = {
    app: 'llm-field-atlas',
    version: 1,
    exportedAt: new Date().toISOString(),
    nodes: store.nodes
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '大模型学习路线-笔记备份-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  toast('已导出备份 JSON');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || !data.nodes) throw new Error('bad');
      let count = 0;
      Object.keys(data.nodes).forEach(id => {
        if (!byId.has(id)) return;
        const rec = data.nodes[id] || {};
        store.nodes[id] = {
          status: (rec.status === 'doing' || rec.status === 'done') ? rec.status : 'todo',
          note: typeof rec.note === 'string' ? rec.note : ''
        };
        count++;
      });
      persist();
      updateProgress();
      renderSidebar();
      if (state.selected) renderPanel();
      needsRender = true;
      toast('已导入 ' + count + ' 条记录');
    } catch (e) {
      toast('备份文件格式不对，导入失败');
    }
  };
  reader.onerror = () => toast('读取文件失败');
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('确定清空所有学习状态和笔记？该操作不可撤销。')) return;
  store = {v:1, nodes:{}};
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  updateProgress();
  renderSidebar();
  if (state.selected) renderPanel();
  toast('已重置');
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* =======================================================================
   启动
   ======================================================================= */
document.getElementById('btnFit').onclick = () => fitView(true);
document.getElementById('btnExport').onclick = exportNotes;
document.getElementById('btnBackup').onclick = exportBackup;
document.getElementById('btnReset').onclick = resetAll;

const restoreInput = document.getElementById('restoreFile');
document.getElementById('btnRestore').onclick = () => restoreInput.click();
restoreInput.onchange = () => {
  if (restoreInput.files && restoreInput.files[0]) importBackup(restoreInput.files[0]);
  restoreInput.value = '';
};

const sidebarEl = document.querySelector('.sidebar');
const scrimEl = document.getElementById('scrim');
function setSidebar(open) {
  sidebarEl.classList.toggle('open', open);
  scrimEl.classList.toggle('show', open);
}
document.getElementById('btnMenu').onclick = () => setSidebar(!sidebarEl.classList.contains('open'));
scrimEl.onclick = () => setSidebar(false);

document.getElementById('btnResetView').onclick = () => {
  Object.keys(state.layers).forEach(k => state.layers[k] = true);
  Object.keys(state.kinds).forEach(k => state.kinds[k] = true);
  searchInput.value = '';
  hideResults();
  renderSidebar();
  fitView(true);
  toast('已重置视图与筛选');
};

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  } else if (e.key === 'Escape') {
    if (tag === 'INPUT') { hideResults(); searchInput.blur(); }
    else closePanel();
  } else if ((e.key === 'f' || e.key === 'F') && tag !== 'INPUT' && tag !== 'TEXTAREA') {
    fitView(true);
  }
});

window.addEventListener('resize', () => { resize(); needsRender = true; });

// 供自动化检查与二次开发使用
window.__atlas = {
  state: state, view: view, nodes: nodes, edges: edges, regions: REGIONS,
  selectNode: selectNode, flyToNode: flyToNode, fitView: fitView, exportNotes: exportNotes
};

// 初始化
resize();
layout();
if (window.innerWidth <= 860) focusRegionInstant("s1"); else fitView(false);
renderSidebar();
updateProgress();
requestAnimationFrame(function loop() {
  if (needsRender) draw();
  requestAnimationFrame(loop);
});

setTimeout(() => {
  let seen = '1';
  try { seen = localStorage.getItem('llm-atlas-seen'); } catch (e) {}
  if (!seen) {
    toast('点击任意节点查看说明并记笔记 · 笔记自动保存在本地');
    try { localStorage.setItem('llm-atlas-seen', '1'); } catch (e) {}
  }
}, 700);

})();
</script>
